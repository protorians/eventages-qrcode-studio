# Desktop release pipeline for Eventages QrCode Studio (Tauri 2).
#
# Builds the desktop app on Windows, macOS and Linux, then uploads the
# installers as assets of the matching GitHub release:
#   - Windows: .msi (WiX) + .exe (NSIS setup)
#   - macOS:   universal .dmg (Intel + Apple Silicon)
#   - Linux:   .deb, .rpm and .AppImage
#
# Triggers:
#   - Push a `v*` tag (e.g. `git tag v0.9.0 && git push origin v0.9.0`)
#     -> the release is published directly and assets are downloadable.
#   - Run manually from the Actions tab (`workflow_dispatch`)
#     -> a DRAFT release is created so the pipeline can be tested without
#        publishing; publish the draft from the Releases page when happy.
#
# The tag name defaults to the `version` field of `src-tauri/tauri.conf.json`
# for manual runs. Keep that version in sync with `package.json` / `Cargo.toml`.

name: Release desktop builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ARM runner (Apple Silicon) building a universal macOS binary.
          - platform: macos-latest
            args: --target universal-apple-darwin
          # 22.04 keeps the bundles compatible with older distros (glibc 2.35).
          # If GitHub retires this image, switch to ubuntu-24.04.
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only needed on macOS to link the universal (aarch64 + x86_64) binary.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies (Tauri v2)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)
              tag="${GITHUB_REF#refs/tags/}"
              ;;
            *)
              # Manual run: fall back to the version in tauri.conf.json.
              version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
              tag="v${version}"
              ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: 'Eventages QrCode Studio ${{ steps.release.outputs.tag }}'
          releaseBody: 'Installers for Windows (MSI/NSIS), macOS (universal DMG, Intel + Apple Silicon) and Linux (deb, rpm, AppImage).'
          # Manual runs create a draft release; tag pushes publish directly.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: false
          generateReleaseNotes: true
          args: ${{ matrix.args }}
