# Desktop release pipeline for Eventages QrCode Studio (Tauri 2).
#
# Builds the desktop app on Windows, macOS and Linux, then uploads the
# installers as assets of the matching GitHub release:
#   - Windows: .msi (WiX) + .exe (NSIS setup)
#   - macOS:   universal .dmg (Intel + Apple Silicon)
#   - Linux:   .deb, .rpm and .AppImage
#
# Triggers:
#   - Push to `main`
#     -> a published release is created for tag `v{version}` (the version
#        comes from `src-tauri/tauri.conf.json`; the tag is created by the
#        release itself).
#   - Push to `alpha` or `beta`
#     -> a published PRE-release is created for tag `v{version}-alpha` /
#        `v{version}-beta`, so testing builds are tagged and downloadable
#        without being advertised as stable.
#   - Push a `v*` tag (e.g. `git tag v0.9.0 && git push origin v0.9.0`)
#     -> the release is published directly and assets are downloadable.
#   - Run manually from the Actions tab (`workflow_dispatch`)
#     -> a DRAFT release is created so the pipeline can be tested without
#        publishing; publish the draft from the Releases page when happy.
#
# Every release body starts with the `## [x.y.z]` section of `CHANGELOG.md`
# matching the pushed version (the changelog of that version), followed by
# the static download notes. When the changelog has no section for the
# version, only the static notes are used and the auto-generated release
# notes (via `generateReleaseNotes`) still list the commits.
#
# The tag name defaults to the `version` field of `src-tauri/tauri.conf.json`
# for manual runs. Keep that version in sync with `package.json` / `Cargo.toml`.

name: Release desktop builds

on:
  push:
    branches:
      - main
      - beta
      - alpha
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ARM runner (Apple Silicon) building a universal macOS binary.
          - platform: macos-latest
            args: --target universal-apple-darwin
          # 22.04 keeps the bundles compatible with older distros (glibc 2.35).
          # If GitHub retires this image, switch to ubuntu-24.04.
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Only needed on macOS to link the universal (aarch64 + x86_64) binary.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies (Tauri v2 + RPM build tools)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          # Extraction native en Bash de la version dans tauri.conf.json (évite d'avoir besoin de Node.js)
          version=$(grep '"version"' src-tauri/tauri.conf.json | head -1 | awk -F '"' '{print $4}')
          case "$GITHUB_REF" in
            refs/tags/*)
              tag="${GITHUB_REF#refs/tags/}"
              ;;
            refs/heads/beta|refs/heads/alpha)
              # Branch pushes (alpha/beta) publish a pre-release tagged after
              # the version, e.g. v0.12.2-beta — the tag is created by the
              # release itself, so published stable releases stay tag-only.
              tag="v${version}-${GITHUB_REF#refs/heads/}"
              ;;
            refs/heads/main|*)
              # main pushes (and manual runs) publish the versioned release.
              tag="v${version}"
              ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog section for the pushed version
        id: changelog
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"
          version="${version%%-*}"
          section=$(awk -v v="$version" '
            index($0, "## [" v "]") == 1 { insec = 1 }
            insec && /^## \[/ && index($0, "## [" v "]") != 1 { exit }
            insec { print }
          ' CHANGELOG.md)
          if [ -n "$section" ]; then
            {
              echo "section<<CHANGELOG_SECTION_EOF"
              echo "$section"
              echo "CHANGELOG_SECTION_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: 'Eventages QrCode Studio ${{ steps.release.outputs.tag }}'
          releaseBody: |
            ${{ steps.changelog.outputs.section }}

            ---

            ## Downloads

            The Tauri desktop builds for each platform are attached below as release assets.

            ### Windows
            - `.msi` (WiX) — system-wide installer
            - `.exe` (NSIS) — setup wizard

            ### macOS
            - `.dmg` — universal binary (Intel + Apple Silicon)

            ### Linux
            - `.deb` — Debian / Ubuntu
            - `.rpm` — Fedora / RHEL
            - `.AppImage` — portable, no installation required
          # Manual runs create a draft; branch and tag pushes publish
          # directly, with alpha/beta builds marked as pre-releases.
          releaseDraft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(steps.release.outputs.tag, '-') }}
          generateReleaseNotes: true
          args: ${{ matrix.args }}
